name: Publish cursor release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-release.yml"
      - "release-notes.md"

permissions:
  contents: write

concurrency:
  group: cursor-release-v1-3-0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Verify installer selection and background behavior
        run: powershell -NoProfile -ExecutionPolicy Bypass -File verify_installer.ps1
      - name: Verify all styles and exports
        run: python -m unittest discover -s tests -v
      - name: Build the full download
        run: python build.py
      - name: Verify the built download
        run: python build.py --check
      - name: Verify native Windows loading
        run: python verify_windows.py dist
      - name: Benchmark native animated cursor drawing
        run: python verify_performance.py dist
      - name: Publish full cursor pack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.3.0
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/Wingline-Cursor-Pack.zip --clobber
            gh release edit "$RELEASE_TAG" --title "Wingline Cursor Pack — Five Styles" --notes-file release-notes.md --latest
          else
            gh release create "$RELEASE_TAG" dist/Wingline-Cursor-Pack.zip --target "$GITHUB_SHA" --title "Wingline Cursor Pack — Five Styles" --notes-file release-notes.md --latest
          fi

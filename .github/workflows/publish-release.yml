name: Publish cursor release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-release.yml"
      - "release-notes.md"

permissions:
  contents: write

concurrency:
  group: cursor-release-v1-8-0
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Verify installer selection and background behavior
        run: powershell -NoProfile -ExecutionPolicy Bypass -File verify_installer.ps1
      - name: Build the full download
        run: python build.py
      - name: Verify all styles and exports
        env:
          WINGLINE_TEST_PACK: dist
        run: python -m unittest discover -s tests -v
      - name: Verify the built download
        run: python build.py --check
      - name: Verify native Windows loading
        run: python verify_windows.py dist
      - name: Benchmark native animated cursor drawing
        run: python verify_performance.py dist
      - name: Build and verify approved Windows Flow, then add it to the full pack
        run: python build_windows_flow.py --output dist-flow --append-pack dist/curs0r-pack.zip
      - name: Publish full cursor pack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.8.0
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/curs0r-pack.zip --clobber
            gh release edit "$RELEASE_TAG" --title "curs0r pack — Eight Styles" --notes-file release-notes.md --latest
          else
            gh release create "$RELEASE_TAG" dist/curs0r-pack.zip --target "$GITHUB_SHA" --title "curs0r pack — Eight Styles" --notes-file release-notes.md --latest
          fi
      - name: Keep only the new pack download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.8.0
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name != "curs0r-pack.zip") | .id' > extra-assets.txt
          while IFS= read -r asset_id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done < extra-assets.txt
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > release-tags.txt
          while IFS= read -r tag; do
            if [ "$tag" != "$RELEASE_TAG" ]; then
              gh release delete "$tag" --yes
            fi
          done < release-tags.txt
